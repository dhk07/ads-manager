<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
<div class="w-full max-w-md p-4">
    <div class="bg-white rounded-2xl shadow-xl">
        <div class="p-6">
            <h1 class="text-2xl font-semibold text-center text-gray-800">Login</h1>
            <form th:action="@{/login}" method="post" class="mt-4 space-y-4">
                <input
                        type="userName"
                        name="userName"
                        placeholder="User Name"
                        class="w-full p-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required
                />
                <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        class="w-full p-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required
                />
                <span th:text="${loginError}" style="color: red; display: block; text-align: center;"></span>

                <button
                        type="submit"
                        class="w-full py-2 mt-2 text-white bg-blue-600 rounded-xl hover:bg-blue-700"
                >
                    Login
                </button>
            </form>
            <div class="mt-6 text-center text-sm text-gray-500">
                Don’t have an account? <a th:href="@{/register}" class="text-blue-600 hover:underline">Sign up</a>
            </div>
        </div>
    </div>
</div>
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
