<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Campaigns - Instagram Campaign Creator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Instagram Campaign Creator</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/campaigns">Campaigns</a>
                </li>
            </ul>
            <div class="d-flex">
                <a href="/logout" class="btn btn-outline-light">Logout</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <h2>Create Instagram Campaign</h2>
            <p>Create a new campaign using the Facebook Graph API</p>

            <div class="card mt-4">
                <div class="card-body">
                    <h5 class="card-title">New Campaign</h5>

                    <form id="campaignForm" class="mt-3">
                        <div class="mb-3">
                            <label for="adAccountId" class="form-label">Ad Account</label>
                            <select class="form-select" id="adAccountId" name="adAccountId" required>
                                <option value="">Select Ad Account</option>
                                <option th:each="account : ${adAccounts}" th:value="${account.id}" th:text="${account.name + ' (' + account.id + ')'}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">Campaign Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>

                        <div class="mb-3">
                            <label for="objective" class="form-label">Objective</label>
                            <select class="form-select" id="objective" name="objective" required>
                                <option value="">Select Objective</option>
                                <option value="AWARENESS">Awareness</option>
                                <option value="TRAFFIC">Traffic</option>
                                <option value="ENGAGEMENT">Engagement</option>
                                <option value="LEAD_GENERATION">Lead Generation</option>
                                <option value="CONVERSIONS">Conversions</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="PAUSED">Paused</option>
                                <option value="ACTIVE">Active</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary">Create Campaign</button>
                    </form>

                    <div id="responseMessage" class="alert mt-3" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('campaignForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = {
            adAccountId: document.getElementById('adAccountId').value,
            name: document.getElementById('name').value,
            objective: document.getElementById('objective').value,
            status: document.getElementById('status').value
        };

        fetch('/campaigns', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            const responseDiv = document.getElementById('responseMessage');

            if (data.success) {
                responseDiv.className = 'alert alert-success mt-3';
                responseDiv.innerHTML = `${data.message}. Campaign ID: ${data.data}`;
            } else {
                responseDiv.className = 'alert alert-danger mt-3';
                responseDiv.innerHTML = data.message;
            }

            responseDiv.style.display = 'block';
        })
        .catch(error => {
            console.error('Error:', error);
            const responseDiv = document.getElementById('responseMessage');
            responseDiv.className = 'alert alert-danger mt-3';
            responseDiv.innerHTML = 'An error occurred. Please try again.';
            responseDiv.style.display = 'block';
        });
    });
</script>
</body>
</html>
