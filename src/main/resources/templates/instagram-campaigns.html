<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Instagram Campaigns - Instagram Campaign Creator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Instagram Campaign Creator</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/campaigns">Facebook Campaigns</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/instagram-campaigns">Instagram Campaigns</a>
                </li>
            </ul>
            <div class="d-flex">
                <a href="/logout" class="btn btn-outline-light">Logout</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <h2>Create Instagram Campaign</h2>
            <p>Create a new campaign specifically for Instagram using the Facebook Graph API</p>

            <div class="card mt-4">
                <div class="card-body">
                    <h5 class="card-title">New Instagram Campaign</h5>

                    <form id="instagramCampaignForm" class="mt-3">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="adAccountId" class="form-label">Ad Account</label>
                                    <select class="form-select" id="adAccountId" name="adAccountId" required>
                                        <option value="">Select Ad Account</option>
                                        <option th:each="account : ${adAccounts}" th:value="${account.id}" th:text="${account.name + ' (' + account.id + ')'}"></option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="instagramAccountId" class="form-label">Instagram Business Account</label>
                                    <select class="form-select" id="instagramAccountId" name="instagramAccountId" required>
                                        <option value="">Select Instagram Account</option>
                                        <option th:each="account : ${instagramAccounts}" th:value="${account.id}" th:text="${account.username + ' (' + account.name + ')'}"></option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="campaignName" class="form-label">Campaign Name</label>
                                    <input type="text" class="form-control" id="campaignName" name="campaignName" required>
                                </div>

                                <div class="mb-3">
                                    <label for="adSetName" class="form-label">Ad Set Name</label>
                                    <input type="text" class="form-control" id="adSetName" name="adSetName" required>
                                </div>

                                <div class="mb-3">
                                    <label for="adName" class="form-label">Ad Name</label>
                                    <input type="text" class="form-control" id="adName" name="adName" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="objective" class="form-label">Objective</label>
                                    <select class="form-select" id="objective" name="objective" required>
                                        <option value="">Select Objective</option>
                                        <option value="REACH">Reach</option>
                                        <option value="TRAFFIC">Traffic</option>
                                        <option value="ENGAGEMENT">Engagement</option>
                                        <option value="LEAD_GENERATION">Lead Generation</option>
                                        <option value="CONVERSIONS">Conversions</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="adText" class="form-label">Ad Text</label>
                                    <textarea class="form-control" id="adText" name="adText" rows="3" required></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="websiteUrl" class="form-label">Website URL</label>
                                    <input type="url" class="form-control" id="websiteUrl" name="websiteUrl" required>
                                </div>

                                <div class="mb-3">
                                    <label for="callToActionType" class="form-label">Call to Action</label>
                                    <select class="form-select" id="callToActionType" name="callToActionType" required>
                                        <option value="LEARN_MORE">Learn More</option>
                                        <option value="SHOP_NOW">Shop Now</option>
                                        <option value="SIGN_UP">Sign Up</option>
                                        <option value="BOOK_TRAVEL">Book Now</option>
                                        <option value="CONTACT_US">Contact Us</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="startDate" class="form-label">Start Date</label>
                                    <input type="text" class="form-control" id="startDate" name="startDate" required>
                                </div>

                                <div class="mb-3">
                                    <label for="status" class="form-label">Status</label>
                                    <select class="form-select" id="status" name="status" required>
                                        <option value="PAUSED">Paused</option>
                                        <option value="ACTIVE">Active</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Create Instagram Campaign</button>
                    </form>

                    <div id="responseMessage" class="alert mt-3" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    // Initialize date picker
    flatpickr("#startDate", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        minDate: "today"
    });

    // Form submission
    document.getElementById('instagramCampaignForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = {
            adAccountId: document.getElementById('adAccountId').value,
            instagramAccountId: document.getElementById('instagramAccountId').value,
            campaignName: document.getElementById('campaignName').value,
            adSetName: document.getElementById('adSetName').value,
            adName: document.getElementById('adName').value,
            objective: document.getElementById('objective').value,
            adText: document.getElementById('adText').value,
            websiteUrl: document.getElementById('websiteUrl').value,
            callToActionType: document.getElementById('callToActionType').value,
            startDate: document.getElementById('startDate').value,
            status: document.getElementById('status').value
        };

        fetch('/instagram-campaigns', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            const responseDiv = document.getElementById('responseMessage');

            if (data.success) {
                responseDiv.className = 'alert alert-success mt-3';
                responseDiv.innerHTML = `${data.message}<br>`;

                // Display created entities
                if (data.data) {
                    const entities = data.data;
                    responseDiv.innerHTML += `Campaign ID: ${entities.campaignId}<br>`;
                    responseDiv.innerHTML += `Ad Set ID: ${entities.adsetId}<br>`;
                    responseDiv.innerHTML += `Creative ID: ${entities.creativeId}<br>`;
                    responseDiv.innerHTML += `Ad ID: ${entities.adId}`;
                }
            } else {
                responseDiv.className = 'alert alert-danger mt-3';
                responseDiv.innerHTML = data.message;
            }

            responseDiv.style.display = 'block';
        })
        .catch(error => {
            console.error('Error:', error);
            const responseDiv = document.getElementById('responseMessage');
            responseDiv.className = 'alert alert-danger mt-3';
            responseDiv.innerHTML = 'An error occurred. Please try again.';
            responseDiv.style.display = 'block';
        });
    });
</script>
</body>
</html>
