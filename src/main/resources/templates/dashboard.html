<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Dashboard</h3>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <h4>User Details</h4>
                    <p><strong>Username:</strong> <span th:text="${username}">Username</span></p>
                    <p><strong>Email:</strong> <span th:text="${email}">Email</span></p>
                    <p><strong>Authentication Provider:</strong> <span th:text="${authProvider}">Provider</span></p>
                </div>
                <div class="col-md-6">
                    <h4>Quick Actions</h4>
                    <div class="list-group">
                        <a href="/profile" class="list-group-item list-group-item-action">Edit Profile</a>
                        <a href="/settings" class="list-group-item list-group-item-action">Account Settings</a>
                        <a href="/logout" class="list-group-item list-group-item-action list-group-item-danger">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
